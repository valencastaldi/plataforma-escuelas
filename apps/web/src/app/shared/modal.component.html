<div class="modal-backdrop" *ngIf="isOpen" (click)="onCancel()"></div>
<div class="modal-container" *ngIf="isOpen && config">
  <div class="modal-content">
    <div class="modal-header">
      <h2>{{ config.title }}</h2>
      <button type="button" class="close-btn" (click)="onCancel()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-form pe-form">
      <div class="form-fields">
        <div class="form-group" *ngFor="let field of fields">
          <label [for]="field.name" class="pe-label" *ngIf="field.type !== 'checkbox'">{{ field.label }}</label>

          <input
            *ngIf="field.type === 'text'"
            [id]="field.name"
            type="text"
            [formControlName]="field.name"
            [placeholder]="field.placeholder || ''"
            class="pe-control"
          />

          <input
            *ngIf="field.type === 'number'"
            [id]="field.name"
            type="number"
            [formControlName]="field.name"
            [min]="field.min ?? null"
            [max]="field.max ?? null"
            class="pe-control"
          />

          <input
            *ngIf="field.type === 'date'"
            [id]="field.name"
            type="date"
            [formControlName]="field.name"
            class="pe-control"
          />

          <textarea
            *ngIf="field.type === 'textarea'"
            [id]="field.name"
            [formControlName]="field.name"
            [placeholder]="field.placeholder || ''"
            class="pe-control"
            rows="3"
          ></textarea>

          <label *ngIf="field.type === 'checkbox'" class="pe-check" [for]="field.name">
            <input
              [id]="field.name"
              type="checkbox"
              [formControlName]="field.name"
              class="form-checkbox"
            />
            <span>{{ field.label }}</span>
          </label>

          <select
            *ngIf="field.type === 'select'"
            [id]="field.name"
            [formControlName]="field.name"
            class="pe-control"
          >
            <option value="" disabled selected>Selecciona {{ field.label.toLowerCase() }}</option>
            <option *ngFor="let opt of field.options" [value]="opt.value">{{ opt.label }}</option>
          </select>

          <div *ngIf="form.get(field.name)?.invalid && form.get(field.name)?.touched" class="pe-error">
            Campo requerido
          </div>
        </div>
      </div>

      <div class="modal-footer pe-actions">
        <button type="button" class="pe-btn pe-btn--ghost" (click)="onCancel()">{{ cancelLabel }}</button>
        <button type="submit" class="pe-btn pe-btn--primary" [disabled]="form.invalid">{{ submitLabel }}</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" *ngIf="isOpen" (click)="onCancel()"></div>
<div class="modal-container" *ngIf="isOpen && config">
  <div class="modal-content">
    <div class="modal-header">
      <h2>{{ config.title }}</h2>
      <button type="button" class="close-btn" (click)="onCancel()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-form">
      <div class="form-fields">
        <div class="form-group" *ngFor="let field of fields">
          <label [for]="field.name">{{ field.label }}</label>

          <input
            *ngIf="field.type === 'text'"
            [id]="field.name"
            type="text"
            [formControlName]="field.name"
            [placeholder]="field.placeholder || ''"
            class="form-input"
          />

          <input
            *ngIf="field.type === 'number'"
            [id]="field.name"
            type="number"
            [formControlName]="field.name"
            [min]="field.min ?? null"
            [max]="field.max ?? null"
            class="form-input"
          />

          <input
            *ngIf="field.type === 'date'"
            [id]="field.name"
            type="date"
            [formControlName]="field.name"
            class="form-input"
          />

          <textarea
            *ngIf="field.type === 'textarea'"
            [id]="field.name"
            [formControlName]="field.name"
            [placeholder]="field.placeholder || ''"
            class="form-input"
            rows="3"
          ></textarea>

          <div *ngIf="field.type === 'checkbox'" class="checkbox-wrapper">
            <input
              [id]="field.name"
              type="checkbox"
              [formControlName]="field.name"
              class="form-checkbox"
            />
            <label [for]="field.name" class="checkbox-label" style="margin-left: 8px">{{ field.label }}</label>
          </div>

          <select
            *ngIf="field.type === 'select'"
            [id]="field.name"
            [formControlName]="field.name"
            class="form-input"
          >
            <option value="" disabled selected>Selecciona {{ field.label.toLowerCase() }}</option>
            <option *ngFor="let opt of field.options" [value]="opt.value">{{ opt.label }}</option>
          </select>

          <div *ngIf="form.get(field.name)?.invalid && form.get(field.name)?.touched" class="error-message">
            Campo requerido
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="onCancel()">{{ cancelLabel }}</button>
        <button type="submit" class="btn-submit" [disabled]="form.invalid">{{ submitLabel }}</button>
      </div>
    </form>
  </div>
</div>

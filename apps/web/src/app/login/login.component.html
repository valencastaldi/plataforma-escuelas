<section class="login-shell">
  <article class="login-card">
    <p class="eyebrow">Plataforma Escuelas</p>
    <h2>Iniciar sesion</h2>
    <p class="hint">Entrá como ALUMNO para ver solo tus datos o como DOCENTE para ver y gestionar todo.</p>

    <form class="pe-form login-form" (ngSubmit)="submit()">
      <label class="pe-field">
        <span class="pe-label">Usuario o email</span>
        <input
          class="pe-control"
          type="text"
          [(ngModel)]="identifier"
          name="identifier"
          autocomplete="username"
          placeholder="docente o docente@escuelas.local"
        />
      </label>

      <label class="pe-field">
        <span class="pe-label">Contraseña</span>
        <input
          class="pe-control"
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          placeholder="********"
        />
      </label>

      <button type="submit" class="pe-btn pe-btn--primary login-submit" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Entrar' }}
      </button>
    </form>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="demo-box" *ngIf="showDemoCredentials">
      <p>Demo docente (seed):</p>
      <strong>docente@escuelas.local / Docente123!</strong>
    </div>
  </article>
</section>
